[package]
name = "akari-rs"
version = "1.0.0"
edition = "2021"
description = "A safe, embeddable scripting language for Rust. Sandboxed by default."
license = "Apache-2.0"
repository = "https://github.com/akari-lang/akari"
repository = "https://github.com/akari-lang/akari"
readme = "README.md"
keywords = ["language", "scripting", "sandbox", "security", "compiler"]
categories = ["compilers", "development-tools"]

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"