<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akari Code Studio - IDE Pro</title>

<!-- Polices Google Fonts & Icônes Lucide -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<!-- PrismJS pour la coloration syntaxique sans bug -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<style>
  :root {
    --bg-main: #0d0e15;
    --bg-side: #13141f;
    --bg-card: #1a1b26;
    --bg-hover: #24283b;
    --border: #292e42;
    --accent: #7aa2f7;
    --accent-hover: #89ddff;
    --text-primary: #c0caf5;
    --text-muted: #565f89;
    --green: #9ece6a;
    --red: #f7768e;
    --yellow: #e0af68;
    --purple: #bb9af7;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-code: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-main);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* --- BARRE DE TITRE --- */
  .titlebar {
    height: 38px;
    background: var(--bg-main);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
  .badge { background: rgba(122, 162, 247, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 12px; font-size: 10px; border: 1px solid rgba(122, 162, 247, 0.3); }

  /* --- WORKBENCH --- */
  .workbench { flex: 1; display: flex; min-height: 0; }

  /* Activity Bar */
  .activity-bar {
    width: 50px;
    background: var(--bg-main);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 12px;
    gap: 16px;
  }
  .act-icon {
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 8px; color: var(--text-muted); transition: all 0.2s;
  }
  .act-icon:hover { color: var(--text-primary); background: var(--bg-hover); }
  .act-icon.active { color: var(--accent); background: rgba(122, 162, 247, 0.12); }

  /* Sidebar */
  .sidebar { width: 250px; background: var(--bg-side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-section { border-bottom: 1px solid var(--border); }
  .sidebar-header {
    padding: 10px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted); display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-actions { display: flex; gap: 8px; }
  .icon-btn { cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
  .icon-btn:hover { color: var(--accent); }

  .file-tree { list-style: none; padding: 4px; }
  .file-item {
    padding: 7px 10px; font-size: 13px; cursor: pointer; color: var(--text-primary);
    border-radius: 6px; display: flex; align-items: center; justify-content: space-between; transition: background 0.15s;
  }
  .file-item:hover { background: var(--bg-hover); }
  .file-item.active { background: rgba(122, 162, 247, 0.15); color: var(--accent); font-weight: 500; }
  .file-item .file-name { display: flex; align-items: center; gap: 8px; }
  .file-del-btn { opacity: 0; color: var(--red); transition: opacity 0.2s; }
  .file-item:hover .file-del-btn { opacity: 1; }

  .variables-list { padding: 8px 12px; font-family: var(--font-code); font-size: 12px; flex: 1; overflow-y: auto; }
  .var-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .var-name { color: var(--purple); font-weight: 600; }
  .var-val { color: var(--green); }

  /* --- EDITOR --- */
  .editor-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-main); }
  
  .tabs-bar { height: 40px; background: var(--bg-side); display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab {
    padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: var(--text-muted); background: var(--bg-side); border-right: 1px solid var(--border);
    cursor: pointer; transition: all 0.2s; border-top: 2px solid transparent;
  }
  .tab:hover { background: var(--bg-main); color: var(--text-primary); }
  .tab.active { background: var(--bg-main); color: var(--accent); border-top-color: var(--accent); font-weight: 500; }

  .editor-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; }

  #lineNumbers {
    width: 48px; background: var(--bg-main); color: var(--text-muted); padding: 14px 0;
    font-family: var(--font-code); font-size: 13px; line-height: 1.6; border-right: 1px solid var(--border);
    user-select: none; text-align: right;
  }
  .line-num { padding-right: 12px; height: 20.8px; }
  .line-num.active { color: var(--accent); font-weight: bold; }

  .code-container { flex: 1; position: relative; height: 100%; overflow: hidden; }

  textarea, #prismCode {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    padding: 14px; font-family: var(--font-code); font-size: 13px; line-height: 1.6;
    tab-size: 4; border: none; outline: none; margin: 0; box-sizing: border-box;
    white-space: pre; word-wrap: normal;
  }

  textarea {
    background: transparent; color: transparent; caret-color: var(--accent);
    resize: none; z-index: 2; overflow: auto;
  }

  #prismCode {
    z-index: 1; pointer-events: none; overflow: hidden; background: transparent !important;
  }

  /* --- TERMINAL --- */
  .terminal-panel { height: 200px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
  .terminal-header {
    height: 36px; background: var(--bg-side); display: flex; align-items: center;
    justify-content: space-between; padding: 0 16px; font-size: 12px; border-bottom: 1px solid var(--border);
  }
  #consoleOutput { flex: 1; padding: 12px 16px; font-family: var(--font-code); font-size: 12px; overflow-y: auto; color: var(--green); line-height: 1.5; }
  #consoleOutput.error { color: var(--red); }

  .debug-toolbar { display: flex; gap: 8px; }
  .btn {
    background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500;
    display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); color: var(--bg-main); border: none; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); }

  /* --- STATUSBAR --- */
  .statusbar {
    height: 26px; background: var(--bg-side); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; color: var(--text-muted);
  }
  #fileInput { display: none; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="brand">
    <i data-lucide="zap" style="width:16px; height:16px;"></i>
    <span>Akari Code Studio</span>
    <span class="badge">v1.0 Pro</span>
  </div>
  <div style="color: var(--text-muted);">Akari Language Environment</div>
</div>

<div class="workbench">
  <div class="activity-bar">
    <div class="act-icon active" title="Fichiers"><i data-lucide="files"></i></div>
    <div class="act-icon" title="Paramètres"><i data-lucide="settings"></i></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-header">
        <span>Explorateur</span>
        <div class="sidebar-actions">
          <i data-lucide="file-plus" class="icon-btn" id="newFileBtn" title="Nouveau fichier"></i>
          <i data-lucide="download" class="icon-btn" id="importBtn" title="Importer"></i>
          <i data-lucide="upload" class="icon-btn" id="exportBtn" title="Exporter"></i>
        </div>
      </div>
      <ul class="file-tree" id="fileTree"></ul>
    </div>

    <div class="sidebar-section" style="flex:1; display:flex; flex-direction:column;">
      <div class="sidebar-header">
        <span>Variables d'exécution</span>
      </div>
      <div class="variables-list" id="variablesList">
        <span style="color: var(--text-muted);">Aucune variable capturée</span>
      </div>
    </div>
  </div>

  <div class="editor-area">
    <div class="tabs-bar" id="tabsBar"></div>
    
    <div class="editor-wrapper">
      <div id="lineNumbers"></div>
      <div class="code-container">
        <textarea id="editor" spellcheck="false"></textarea>
        <pre id="prismCode"><code class="language-python" id="highlightCode"></code></pre>
      </div>
    </div>

    <div class="terminal-panel">
      <div class="terminal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <i data-lucide="terminal" style="width:14px; height:14px; color:var(--accent);"></i>
          <span>Console de sortie</span>
        </div>
        <div class="debug-toolbar">
          <button class="btn primary" id="runBtn"><i data-lucide="play" style="width:13px; height:13px;"></i> Exécuter</button>
          <button class="btn" id="clearBtn"><i data-lucide="trash-2" style="width:13px; height:13px;"></i> Vider</button>
        </div>
      </div>
      <pre id="consoleOutput">Système prêt.</pre>
    </div>
  </div>
</div>

<div class="statusbar">
  <div style="display:flex; align-items:center; gap:6px;">
    <span id="statusDot" style="width:8px; height:8px; border-radius:50%; background:var(--green);"></span>
    <span id="statusMessage">Prêt</span>
  </div>
  <div id="cursorPos">Ln 1, Col 1</div>
</div>

<input type="file" id="fileInput" accept=".akari,.txt">

<script>
  // Initialisation des icônes
  lucide.createIcons();

  var STORAGE_KEY = 'akari_ide_files_v2';
  var DEFAULT_FILES = {
    'main.akari': '# Bienvenue sur Akari Code Studio\nimport "math.akari"\n\nlet name = "Akari Studio"\nmut counter = 0\n\ndef calculate():\n    for i in 1..5:\n        counter = add(counter, i)\n    end\nend\n\ncalculate()\nsay("Résultat de la somme :", toText(counter))',
    'math.akari': '# Module de calculs\ndef add(a, b):\n    return a + b\nend'
  };

  var files = {};
  try {
    var stored = localStorage.getItem(STORAGE_KEY);
    files = stored ? JSON.parse(stored) : DEFAULT_FILES;
  } catch (e) { files = DEFAULT_FILES; }

  var activeFile = files['main.akari'] ? 'main.akari' : Object.keys(files)[0];

  var editor = document.getElementById('editor');
  var highlightCode = document.getElementById('highlightCode');
  var prismCode = document.getElementById('prismCode');
  var lineNumbers = document.getElementById('lineNumbers');
  var consoleOutput = document.getElementById('consoleOutput');
  var fileTree = document.getElementById('fileTree');
  var tabsBar = document.getElementById('tabsBar');
  var variablesList = document.getElementById('variablesList');

  // Moteur de transpilation
  function transpile(code) {
    var lines = code.split('\n');
    var jsOutput = [
      "var say = function() { console.log.apply(console, arguments); };",
      "var toText = function(v) { return String(v); };"
    ];

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();

      if (!trimmed || trimmed.indexOf('#') === 0) {
        jsOutput.push(""); continue;
      }

      var importMatch = trimmed.match(/^import\s+["'](.*?)["']/);
      if (importMatch && files[importMatch[1]]) {
        jsOutput.push(transpile(files[importMatch[1]]));
        continue;
      }

      var js = line
        .replace(/\blet\s+([a-zA-Z0-9_]+)\s*=/, 'var $1 =')
        .replace(/\bmut\s+([a-zA-Z0-9_]+)\s*=/, 'var $1 =')
        .replace(/\bdef\s+([a-zA-Z0-9_]+)\((.*?)\):/, 'function $1($2) {')
        .replace(/\bif\s+(.*?):/, 'if ($1) {')
        .replace(/\belse:/, '} else {')
        .replace(/\bend\b/, '}');

      var forMatch = js.match(/\bfor\s+([a-zA-Z0-9_]+)\s+in\s+([0-9]+)\.\.([0-9]+):/);
      if (forMatch) {
        var indent = js.substring(0, js.indexOf('for'));
        js = indent + 'for (var ' + forMatch[1] + ' = ' + forMatch[2] + '; ' + forMatch[1] + ' <= ' + forMatch[3] + '; ' + forMatch[1] + '++) {';
      }

      jsOutput.push(js);
    }
    return jsOutput.join('\n');
  }

  // Synchronisation du rendu et de la coloration
  function updateEditor() {
    var val = editor.value;
    files[activeFile] = val;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(files)); } catch(e){}

    // Mise à jour de la syntaxe avec PrismJS (sans réinjection HTML problématique)
    highlightCode.textContent = val;
    Prism.highlightElement(highlightCode);

    // Numéros de lignes
    var lineCount = val.split('\n').length;
    var currentLine = val.substring(0, editor.selectionStart).split('\n').length;
    var numsHtml = '';
    for (var i = 1; i <= lineCount; i++) {
      numsHtml += '<div class="line-num' + (i === currentLine ? ' active' : '') + '">' + i + '</div>';
    }
    lineNumbers.innerHTML = numsHtml;

    // Position du curseur
    var col = val.substring(0, editor.selectionStart).split('\n').pop().length + 1;
    document.getElementById('cursorPos').textContent = 'Ln ' + currentLine + ', Col ' + col;
  }

  // Synchronisation des défilements
  editor.onscroll = function() {
    prismCode.scrollTop = editor.scrollTop;
    prismCode.scrollLeft = editor.scrollLeft;
    lineNumbers.scrollTop = editor.scrollTop;
  };

  // Rendu de l'UI des fichiers
  function renderUI() {
    fileTree.innerHTML = ''; tabsBar.innerHTML = '';
    for (var fname in files) {
      // Arborescence
      var li = document.createElement('li');
      li.className = 'file-item' + (fname === activeFile ? ' active' : '');
      li.innerHTML = '<div class="file-name"><i data-lucide="file-code" style="width:14px; height:14px;"></i>' + fname + '</div>' +
                     '<i data-lucide="x" class="file-del-btn" style="width:12px; height:12px;"></i>';
      
      (function(f, el) {
        el.querySelector('.file-name').onclick = function() { switchFile(f); };
        el.querySelector('.file-del-btn').onclick = function(e) {
          e.stopPropagation();
          if (Object.keys(files).length <= 1) return;
          delete files[f];
          if (activeFile === f) activeFile = Object.keys(files)[0];
          renderUI(); switchFile(activeFile);
        };
      })(fname, li);
      fileTree.appendChild(li);

      // Onglets
      var tab = document.createElement('div');
      tab.className = 'tab' + (fname === activeFile ? ' active' : '');
      tab.innerHTML = '<i data-lucide="file-text" style="width:13px; height:13px;"></i>' + fname;
      (function(f) { tab.onclick = function() { switchFile(f); }; })(fname);
      tabsBar.appendChild(tab);
    }
    lucide.createIcons();
  }

  function switchFile(fname) {
    activeFile = fname;
    editor.value = files[fname];
    renderUI();
    updateEditor();
  }

  // Exécution du code
  document.getElementById('runBtn').onclick = function() {
    consoleOutput.className = '';
    consoleOutput.textContent = 'Exécution en cours...\n';
    
    try {
      var js = transpile(editor.value);
      var logs = [];
      var oldLog = console.log;
      console.log = function() { logs.push(Array.prototype.slice.call(arguments).join(' ')); };

      var runner = new Function(js);
      runner();

      console.log = oldLog;
      consoleOutput.textContent = logs.length ? logs.join('\n') : '(Programme exécuté sans sortie console)';
      document.getElementById('statusMessage').textContent = 'Exécution réussie';
      document.getElementById('statusDot').style.background = 'var(--green)';

      // Extraction simplifiée des variables globales
      var varsHtml = '';
      var varMatches = editor.value.match(/\b(let|mut)\s+([a-zA-Z0-9_]+)/g) || [];
      varMatches.forEach(function(m) {
        var vName = m.split(/\s+/)[1];
        try {
          var val = new Function(js + '\nreturn ' + vName + ';')();
          varsHtml += '<div class="var-row"><span class="var-name">' + vName + '</span><span class="var-val">' + JSON.stringify(val) + '</span></div>';
        } catch(e){}
      });
      variablesList.innerHTML = varsHtml || '<span style="color: var(--text-muted);">Aucune variable capturée</span>';

    } catch (err) {
      consoleOutput.className = 'error';
      consoleOutput.textContent = 'Erreur d\'exécution :\n' + err.message;
      document.getElementById('statusMessage').textContent = 'Erreur';
      document.getElementById('statusDot').style.background = 'var(--red)';
    }
  };

  // Actions de fichiers
  document.getElementById('newFileBtn').onclick = function() {
    var name = prompt('Nom du fichier (.akari) :', 'script.akari');
    if (name) {
      if (!name.endsWith('.akari')) name += '.akari';
      files[name] = '# ' + name + '\n';
      switchFile(name);
    }
  };

  document.getElementById('clearBtn').onclick = function() { consoleOutput.textContent = ''; };

  editor.oninput = updateEditor;
  editor.onclick = editor.onkeyup = updateEditor;

  // Démarrage
  editor.value = files[activeFile];
  renderUI();
  updateEditor();
</script>
</body>
</html>
